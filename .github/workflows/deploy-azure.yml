name: Evaluate, publish, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend

jobs:
  langsmith-evaluation:
    name: LangSmith release evaluation
    runs-on: ubuntu-latest
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      LANGSMITH_PROJECT: rag-evaluations
      LANGSMITH_DATASET: ${{ vars.LANGSMITH_DATASET || 'rag-regression' }}
      LANGSMITH_EXPERIMENT: rag-regression-${{ github.sha }}
      LANGSMITH_MIN_SCORE: ${{ vars.LANGSMITH_MIN_SCORE || '1.0' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'glm-5.3-flash' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evaluation dependencies
        run: python -m pip install -r requirements-backend.txt

      - name: Run LangSmith regression gate
        run: python scripts/run_langsmith_eval.py

  publish-and-deploy:
    name: Publish to Docker Hub and deploy Azure
    needs: langsmith-evaluation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend container
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_BACKEND_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          inlineScript: |
            az webapp config container set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_BACKEND_APP_NAME" \
              --docker-custom-image-name "${BACKEND_IMAGE}:${IMAGE_TAG}" \
              --docker-registry-server-url https://index.docker.io/v1 \
              --docker-registry-server-user "$DOCKERHUB_USERNAME" \
              --docker-registry-server-password "$DOCKERHUB_TOKEN"

      - name: Deploy frontend container
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FRONTEND_APP_NAME: ${{ vars.AZURE_FRONTEND_APP_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          inlineScript: |
            az webapp config container set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_FRONTEND_APP_NAME" \
              --docker-custom-image-name "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
              --docker-registry-server-url https://index.docker.io/v1 \
              --docker-registry-server-user "$DOCKERHUB_USERNAME" \
              --docker-registry-server-password "$DOCKERHUB_TOKEN"
