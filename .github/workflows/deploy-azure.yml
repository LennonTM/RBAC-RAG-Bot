name: Evaluate, publish, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend

jobs:
  langsmith-evaluation:
    name: LangSmith release evaluation
    runs-on: ubuntu-latest
    environment: production
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT || 'rag-evaluations' }}
      LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
      LANGSMITH_DATASET: ${{ secrets.LANGSMITH_DATASET || 'rag-regression' }}
      LANGSMITH_EXPERIMENT: rag-regression-${{ github.sha }}
      LANGSMITH_MIN_SCORE: ${{ secrets.LANGSMITH_MIN_SCORE || '1.0' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL || 'glm-5.3-flash' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_EMBEDDING_MODEL: ${{ secrets.HUGGINGFACE_EMBEDDING_MODEL || 'sentence-transformers/all-MiniLM-L6-v2' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evaluation dependencies
        run: python -m pip install -r requirements-backend.txt

      - name: Run LangSmith regression gate
        run: python scripts/run_langsmith_eval.py

  publish-and-deploy:
    name: Publish to Docker Hub and deploy Azure
    needs: langsmith-evaluation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision Azure Web Apps
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION || 'eastus' }}
          AZURE_APP_SERVICE_PLAN: ${{ secrets.AZURE_APP_SERVICE_PLAN || 'rag-linux-plan' }}
          AZURE_BACKEND_APP_NAME: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          AZURE_FRONTEND_APP_NAME: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
        with:
          inlineScript: |
            az group create \
              --name "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION"

            if ! az appservice plan show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_APP_SERVICE_PLAN" >/dev/null 2>&1; then
              az appservice plan create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_APP_SERVICE_PLAN" \
                --location "$AZURE_LOCATION" \
                --is-linux \
                --sku B1
            fi

            if ! az webapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_BACKEND_APP_NAME" >/dev/null 2>&1; then
              az webapp create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --plan "$AZURE_APP_SERVICE_PLAN" \
                --name "$AZURE_BACKEND_APP_NAME"
            fi

            if ! az webapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_FRONTEND_APP_NAME" >/dev/null 2>&1; then
              az webapp create \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --plan "$AZURE_APP_SERVICE_PLAN" \
                --name "$AZURE_FRONTEND_APP_NAME"
            fi

      - name: Deploy backend container
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_BACKEND_APP_NAME: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL || 'glm-5.3-flash' }}
        with:
          inlineScript: |
            az webapp config container set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_BACKEND_APP_NAME" \
              --container-image-name "${BACKEND_IMAGE}:${IMAGE_TAG}" \
              --container-registry-url https://index.docker.io/v1 \
              --container-registry-user "$DOCKERHUB_USERNAME" \
              --container-registry-password "$DOCKERHUB_TOKEN"
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_BACKEND_APP_NAME" \
              --settings WEBSITES_PORT=8000 OPENCODE_API_KEY="$OPENCODE_API_KEY" OPENCODE_MODEL="$OPENCODE_MODEL"

      - name: Deploy frontend container
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_FRONTEND_APP_NAME: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          AZURE_BACKEND_APP_NAME: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          inlineScript: |
            az webapp config container set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_FRONTEND_APP_NAME" \
              --container-image-name "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
              --container-registry-url https://index.docker.io/v1 \
              --container-registry-user "$DOCKERHUB_USERNAME" \
              --container-registry-password "$DOCKERHUB_TOKEN"
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_FRONTEND_APP_NAME" \
              --settings WEBSITES_PORT=8501 API_URL="https://${AZURE_BACKEND_APP_NAME}.azurewebsites.net"
